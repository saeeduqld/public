# Free Render web service for the AI friction research chatbot.
# Never commit a real OpenRouter API key to this file.
services:
  - type: web
    name: ai-friction-chatbot-secure
    runtime: python
    plan: free
    rootDir: ai-friction-secure
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-4.1-mini
      - key: APP_ACCESS_CODE
        sync: false
      - key: MAX_REQUESTS_PER_IP_PER_HOUR
        value: "60"